<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chios · Terrain Lab</title><link rel="stylesheet" href="style.css"></head><body>
<main><canvas id="view" tabindex="0" aria-label="Terrain view; use mouse and controls described in panel"></canvas><section id="panel"><h1>CHIOS <span>Terrain Lab v1</span></h1><p id="status">Loading elevation data…</p><div class="row"><label>Mode <select id="mode"><option value="orbit">Overview</option><option value="fly">Explorer</option></select></label><label>Speed <select id="speed"><option value="40">40 m/s</option><option value="250" selected>250 m/s</option><option value="1000">1000 m/s</option></select></label></div><div class="row"><button data-preset="overview">Whole island</button><button data-preset="coast">Coast</button><button data-preset="mountain">Mountain</button><button data-preset="ground">Near ground</button></div><div class="row checks"><label><input id="lod" type="checkbox" checked> LOD</label><label><input id="ocean" type="checkbox" checked> Ocean</label><label><input id="wire" type="checkbox"> Wireframe</label><label><input id="bounds" type="checkbox"> Tile edges</label></div><p id="help">Overview: drag to orbit · right-drag to pan · wheel to zoom. Explorer: click terrain, mouse to look; W/A/S/D move, R/F up/down, Esc releases mouse.</p><pre id="stats" aria-live="off"></pre></section></main><script type="module" src="lab.js?v=terrain-v1-1-final"></script></body></html>
